"confirm_order.termsAdditional":"The administrator of your personal data provided in the form is {name}{place}. Your personal data will be processed in particular for the purpose of processing your order, the legitimate interests of the administrator in the form of communication with you, for statistical and analytical purposes of the administrator and, if you have given your consent, also for marketing purposes, including profiling. Consents are voluntary and can be revoked at any time (which does not affect the lawfulness of previous processing). For more information on the processing of personal data, please see the Privacy Policy.","cookiesSettings.description":"When you visit our website, the site asks your browser to store a small piece of data (a text file) called a cookie on your device in order to remember information about you, your preferences or your device. This information does not usually directly identify you, but may give you a more personalized experience using the site. Because we respect your right to privacy, you may choose not to use certain types of cookies. Click on the different category headings to learn more and change our default settings. However, blocking some types of cookies may affect your experience of using the site and the services we can offer.","cookiesSettings.necessary":"Necessary","cookiesSettings.alwaysActive":"Always active","cookiesSettings.necessaryDescription":"These cookies are essential for the website to function and cannot be switched off in our systems. You can set your browser to block or alert you about these cookies, but that will cause some parts of the site to not work.","cookiesSettings.essentialCookies":"Our essential cookies","cookiesSettings.adyenDescription":"We use Adyen to process payments on our website. Adyen is a global payment processing service. Adyen offers a secure and reliable payment platform that allows us to accept various payment methods from our customers, including credit cards, debit cards, and digital wallets. More details about service can be found on the company page - \u003ca href=\"https://www.adyen.com/\" target=\"_blank\" rel=\"noreferrer\"\u003eadyen.com\u003c/a\u003e.\u003cbr /\u003e\u003cspan\u003eAdyen also uses cookies\u003c/span\u003e and similar technologies to improve its services and personalize your experience. These cookies and technologies may collect information about your device, browser, and usage patterns. For more information on Adyen\u0026quot;s use of cookies and technologies, please refer to their Cookie Policy \u003ca href=\"https://www.adyen.com/policies-and-disclaimer/cookie-policy\" target=\"_blank\" rel=\"noreferrer\"\u003ehere\u003c/a\u003e.\u003cbr /\u003eIn addition, Adyen may share some of your personal information with third-party service providers, such as fraud prevention agencies, to help protect against fraudulent transactions. \u003cbr /\u003eFor more information on Adyen\u0026quot;s data processing practices and your rights as a data subject, please refer to their Privacy Policy \u003ca href=\"https://www.adyen.com/policies-and-disclaimer/privacy-policy\" target=\"_blank\" rel=\"noreferrer\"\u003ehere\u003c/a\u003e","cookiesSettings.googleMapsDescription":"Google Maps API is a map service provided by Google Inc., 1600 Amphitheater Parkway Mountain View, CA 94043, USA. We need to use the Google Maps API so that you can indicate the delivery location of your order on the map. When using Google Maps, information about your use of this website (including your IP address) can be transmitted to a Google server in the USA and stored there. The following links provide information on \u003ca href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noreferrer\"\u003edata protection\u003c/a\u003e and to the \u003ca href=\"https://www.google.com/help/terms_maps/\" target=\"_blank\" rel=\"noreferrer\"\u003eTerms of Use\u003c/a\u003e on Google Maps.","cookiesSettings.analyticsCookies":"Analytics Cookies","cook
